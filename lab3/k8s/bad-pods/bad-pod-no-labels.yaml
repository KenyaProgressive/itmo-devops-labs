apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-labels
  namespace: default
  ## нет labels
spec:
  containers:
    - name: bad-pod-no-labels
      image: api:v1
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1000m"
          memory: "150Mi"
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
      securityContext:
        runAsNonRoot: true
        privileged: false