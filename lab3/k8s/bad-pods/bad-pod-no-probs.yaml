apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-probs
  namespace: default
  labels:
    app: api
    environment: dev
spec:
  containers:
    - name: bad-pod-no-probs
      image: api:v1
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1000m"
          memory: "150Mi"
        ## нет проб
      securityContext:
        runAsNonRoot: true
        privileged: false