{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  labels:
    app.kubernetes.io/part-of: shop
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicies.postgres.podLabels | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicies.postgres.clientAppLabels }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicies.postgres.allowPort }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.postgres.operatorNamespace | quote }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.postgres.podLabels | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.postgres.podLabels | nindent 14 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.postgres.operatorNamespace | quote }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
{{- end }}
