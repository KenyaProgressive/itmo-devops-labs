{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker
  labels:
    app.kubernetes.io/part-of: shop
    app: worker
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.postgres.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicies.postgres.allowPort }}
{{- end }}
