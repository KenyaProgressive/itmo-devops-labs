apiVersion: v1
kind: Pod
metadata:
  name: stranger
  labels:
    app: stranger
    environment: dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
  containers:
    - name: stranger
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        privileged: false
      livenessProbe:
        httpGet:
          path: /
          port: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
